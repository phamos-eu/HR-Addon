name: Workday Unit Tests

on:
  push:
    branches: [main, develop, version-15, automated-testing, suncycle-version-15]
  pull_request:
    branches: [main, develop, version-15, suncycle-version-15]

permissions:
  contents: read

jobs:
  workday-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_frappe
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis-cache:
        image: redis:alpine
        ports:
          - 6379:6379

      redis-queue:
        image: redis:alpine
        ports:
          - 6380:6379

    steps:
      - name: Checkout HR Addon
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            mariadb-client \
            redis-tools \
            python3-dev \
            libmariadb-dev \
            libmariadb-dev-compat \
            wkhtmltopdf \
            xvfb \
            libfontconfig \
            libxrender1

      - name: Install Frappe Bench
        run: |
          pip install --upgrade pip
          pip install frappe-bench

      - name: Initialize bench
        run: |
          bench init --skip-redis-config-generation --frappe-branch version-15 frappe-bench
        env:
          CI: true

      - name: Get ERPNext and HRMS
        working-directory: frappe-bench
        run: |
          bench get-app --branch version-15 erpnext
          bench get-app --branch version-15 hrms

      - name: Install HR Addon
        working-directory: frappe-bench
        run: |
          cp -r "${GITHUB_WORKSPACE}" ./apps/hr_addon
          if [ -s sites/apps.txt ] && [ -n "$(tail -c1 sites/apps.txt)" ]; then
            echo >> sites/apps.txt
          fi
          grep -qxF "hr_addon" sites/apps.txt || echo "hr_addon" >> sites/apps.txt
          bench pip install -e ./apps/hr_addon

      - name: Create site and install apps
        working-directory: frappe-bench
        run: |
          bench set-config -g db_host 127.0.0.1
          bench set-config -g db_port 3306
          bench set-config -g redis_cache redis://127.0.0.1:6379
          bench set-config -g redis_queue redis://127.0.0.1:6380
          bench set-config -g redis_socketio redis://127.0.0.1:6379

          bench new-site test.localhost \
            --db-root-password root \
            --admin-password admin \
            --mariadb-root-username root \
            --mariadb-root-password root \
            --no-mariadb-socket

          bench --site test.localhost install-app erpnext
          bench --site test.localhost install-app hrms
          bench --site test.localhost install-app hr_addon

      - name: Run Workday unit tests
        working-directory: frappe-bench
        run: |
          bench --site test.localhost run-tests \
            --app hr_addon \
            --module hr_addon.hr_addon.doctype.workday.test_workday
        env:
          CI: true

      - name: Test summary
        if: always()
        run: |
          echo "## Workday unit tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Module: \`hr_addon.hr_addon.doctype.workday.test_workday\`" >> "$GITHUB_STEP_SUMMARY"
